name: Build and Upload Android AAR Packages (No Script Modification)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: "Build AARs with Bazel"
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "0.0.0-nightly-SNAPSHOT"
      # Disable Bazel's Android platform resolution to use legacy flags
      BAZEL_CONFIG_FLAGS: "--incompatible_enable_android_toolchain_resolution=false"
      # BUILD_LITERT_KOTLIN_API: "true"   # Uncomment if needed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # Install Bazel (will respect .bazelversion if present)
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazel-version: 7.0.0  # or omit to auto-detect from .bazelversion

      # Install system dependencies: Python and JDK 17
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      # Set up Android SDK (provides ANDROID_HOME)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Set up Android NDK
      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25  # Adjust to match your project's requirements
          local-cache: true

      # Export Android environment variables for Bazel
      - name: Export Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      # Run TensorFlow configure script to set up Android workspace (if exists)
      - name: Configure TensorFlow for Android
        run: |
          # The TF_SET_ANDROID_WORKSPACE=1 tells configure to set up Android repositories.
          export TF_SET_ANDROID_WORKSPACE=1
          if [ -f ./configure.py ]; then
            # Run configure.py non-interactively by answering 'y' to any prompt
            python3 ./configure.py <<< "y"
          else
            echo "No configure.py found; assuming WORKSPACE is already configured."
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          TF_SET_ANDROID_WORKSPACE: 1

      # Execute the packaging script
      - name: Run build_android_package.sh
        run: |
          chmod +x ./ci/build_android_package.sh
          echo "BAZEL_CONFIG_FLAGS = $BAZEL_CONFIG_FLAGS"
          ./ci/build_android_package.sh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          BAZEL_CONFIG_FLAGS: ${{ env.BAZEL_CONFIG_FLAGS }}
          # BUILD_LITERT_KOTLIN_API: ${{ env.BUILD_LITERT_KOTLIN_API }}

      # List generated files (for debugging)
      - name: List generated files
        run: find ./ci/gen -type f

      # Upload all AAR packages and associated files
      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litert-android-aars
          path: ci/gen/
          if-no-files-found: error
