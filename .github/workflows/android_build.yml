name: Build and Upload Android AAR Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: "Build AARs with Bazel"
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "0.0.0-nightly-SNAPSHOT"
      ANDROID_API_LEVEL: "36"
      NDK_VERSION: "r27"
      KLEIDIAI_COMMIT: "51f7190558e51b7415d9ba24994fb477d7371446"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch build_android_package.sh
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x ./ci/build_android_package.sh

          # 备份原始脚本
          cp ./ci/build_android_package.sh ./ci/build_android_package.sh.bak

          # ---------- 使用 Python 精确修补脚本 ----------
          python3 << 'PYEOF'
          import re

          script_path = 'ci/build_android_package.sh'
          with open(script_path, 'r') as f:
              content = f.read()

          # 1. 注释掉环境变量注入行
          content = re.sub(
              r'^BUILD_FLAGS\+=\(\$\{BAZEL_CONFIG_FLAGS\}\)',
              r'# \g<0>',
              content,
              flags=re.MULTILINE
          )

          # 2. 移除所有 --copt=-mno-sse* 选项
          content = re.sub(r' --copt=-mno-sse4[^ ]*', '', content)

          # 3. 修复 bazel build ... select-tf-ops 命令中的多余续行符
          content = re.sub(
              r'(--define=TENSORFLOW_PROTOS=lite\s*\\\s*\n)\s*\\\s*\n(\s*//tflite/java:tensorflow-lite-select-tf-ops)',
              r'\1\2',
              content
          )

          # 4. 在 BUILD_FLAGS 数组中按原有格式插入必需的标志
          def expand_build_flags(m):
              block = m.group(0)            # 整个 BUILD_FLAGS=(...)
              required_flags = [
                  '--copt=-D__ANDROID__',
                  '--copt=-UINTEL_MKL',
                  '--linkopt=-Wl,--undefined-version',
                  '--linkopt=-Wl,--allow-multiple-definition',
                  '--incompatible_enable_android_toolchain_resolution=false',
              ]
              existing = set(re.findall(r'"([^"]*)"', block))
              new_flags = [f for f in required_flags if f not in existing]
              if not new_flags:
                  return block

              # 构建新行：保留原缩进，最后一个原标志行末尾加 \，然后插入新标志
              indent = '    '
              # 匹配最后一个标志行（以 " 结尾，后跟可选空格和 ) ）
              modified_block = re.sub(
                  r'(\s*"(--show_timestamps|[^"]*)")(\s*\))$',
                  lambda m: m.group(1) + ' \\\n' + \
                            '\n'.join(f'{indent}"{flag}" \\' for flag in new_flags[:-1]) + \
                            (f'\n{indent}"{new_flags[-1]}"' if new_flags else '') + \
                            '\n)',
                  block,
                  flags=re.MULTILINE
              )
              return modified_block

          content = re.sub(
              r'BUILD_FLAGS\s*=\s*\(.*?\)',
              expand_build_flags,
              content,
              flags=re.DOTALL
          )

          with open(script_path, 'w') as f:
              f.write(content)

          print("✅ Script patched successfully")
          PYEOF

          # ---------- 打印修改后的完整脚本（带行号） ----------
          echo "=== Patched script content (full file) ==="
          cat -n ./ci/build_android_package.sh
          echo "=== Total lines: $(wc -l < ./ci/build_android_package.sh) ==="

          # ---------- 打印差异 ----------
          echo "=== Diff from original ==="
          diff ./ci/build_android_package.sh.bak ./ci/build_android_package.sh || true

          echo "=== Final build commands after patching ==="
          grep -n 'bazel build' ci/build_android_package.sh

      # ==================== 新增：克隆 TensorFlow 源码 ====================
      - name: Clone TensorFlow source
        run: |
          git clone --depth 1 https://github.com/tensorflow/tensorflow.git /tmp/tensorflow
          echo "✅ TensorFlow cloned to /tmp/tensorflow"
      # ====================================================================


      # 彻底删除 org_tensorflow 中所有文件里的 -msse3 / -msse4.1 / -msse4.2 / -DWEBP_HAVE_SSE41，并精确对比修改前后相同行（含上下文）
      - name: Remove all SSE options from org_tensorflow with before/after context
        run: |
          TF_DIR="/tmp/tensorflow"
          if [ -d "$TF_DIR" ]; then
            echo "Scanning $TF_DIR for files containing -msse3, -msse4.1, -msse4.2, -DWEBP_HAVE_SSE41..."
            # 1. 修改前：显示匹配行及上下文（前后各3行）
            echo "=== BEFORE: Lines containing SSE options (with context) ==="
            find "$TF_DIR" -type f ! -name "*.o" ! -name "*.a" ! -name "*.so" ! -name "*.pyc" ! -name "*.bak" \
              -exec grep -n -H -C3 -E '\-msse3|\-msse4\.1|\-msse4\.2|\-DWEBP_HAVE_SSE41' {} \; || echo "(none found)"

            # 2. 记录所有匹配文件的匹配行号（用于修改后打印）
            find "$TF_DIR" -type f ! -name "*.o" ! -name "*.a" ! -name "*.so" ! -name "*.pyc" ! -name "*.bak" \
              -exec grep -n -H -E '\-msse3|\-msse4\.1|\-msse4\.2|\-DWEBP_HAVE_SSE41' {} \; > /tmp/sse_lines_before.txt

            if [ -s /tmp/sse_lines_before.txt ]; then
              # 3. 执行修改：.tpl 文件只移除字符串，其他文件整行删除
              grep '\.tpl:' /tmp/sse_lines_before.txt | cut -d: -f1 | sort -u | while read file; do
                [ -f "$file" ] && sed -i -e 's/-msse3//g' -e 's/-msse4\.1//g' -e 's/-msse4\.2//g' -e 's/-DWEBP_HAVE_SSE41//g' "$file"
              done
              grep -v '\.tpl:' /tmp/sse_lines_before.txt | cut -d: -f1 | sort -u | while read file; do
                [ -f "$file" ] && sed -i '/-msse3\|-msse4\.1\|-msse4\.2\|-DWEBP_HAVE_SSE41/d' "$file"
              done

              # 4. 修改后：对于之前匹配的每一行，打印当前内容（带上下文标记）
              echo "=== AFTER: The same lines after modification ==="
              while IFS=: read file line rest; do
                if [ -f "$file" ]; then
                  new_line=$(sed -n "${line}p" "$file" 2>/dev/null)
                  if [ -z "$new_line" ]; then
                    echo "$file:$line: [LINE DELETED]"
                  else
                    echo "$file:$line: $new_line"
                    if [[ "$file" == *.tpl ]]; then
                      echo "   (context after removal)"
                      sed -n "$((line-3)),$((line+3))p" "$file" | sed 's/^/   /'
                    fi
                  fi
                else
                  echo "$file:$line: [FILE MISSING]"
                fi
              done < /tmp/sse_lines_before.txt
              echo "✅ All SSE options (-msse3, -msse4.1, -msse4.2, -DWEBP_HAVE_SSE41) removed successfully."
            else
              echo "✅ No SSE options found in org_tensorflow."
            fi
          else
            echo "TensorFlow directory not found, skipping"
          fi

      # 处理 ZenDNN 和 MKL 相关文件：删除有问题的源文件，并替换 mkl_util.h 为空文件
      - name: Handle MKL and ZenDNN files
        run: |
          TF_DIR="/tmp/tensorflow"
          # 删除 ZenDNN 相关文件
          rm -vf "$TF_DIR/tensorflow/core/common_runtime/eager/zen_eager_op_rewrite.cc"
          rm -vf "$TF_DIR/tensorflow/core/graph/zen_graph_util.h"
          # 删除 MKL 源文件
          rm -vf "$TF_DIR/tensorflow/core/common_runtime/eager/mkl_eager_op_rewrite.cc"
          # 删除原 mkl_util.h 并创建空文件（使用 printf 避免 EOF 缩进问题）
          MKL_UTIL_H="$TF_DIR/tensorflow/core/util/mkl_util.h"
          rm -vf "$MKL_UTIL_H"
          mkdir -p "$(dirname "$MKL_UTIL_H")"
          printf '%s\n' "#ifndef TENSORFLOW_CORE_UTIL_MKL_UTIL_H_" \
                       "#define TENSORFLOW_CORE_UTIL_MKL_UTIL_H_" \
                       "// Empty file for Android build to satisfy dependencies." \
                       "#endif" > "$MKL_UTIL_H"
          echo "Created empty $MKL_UTIL_H"

      # 修复 hash BUILD 因 copts 行被删可能缺 copts 属性
      - name: Fix hash BUILD copts if missing
        run: |
          HASH_BUILD="/tmp/tensorflow/third_party/xla/xla/tsl/lib/hash/BUILD"
          if [ -f "$HASH_BUILD" ]; then
            if ! grep -q 'copts\s*=' "$HASH_BUILD"; then
              sed -i '/hdrs\s*=\s*\[/a\    copts = tsl_copts(),' "$HASH_BUILD"
              echo "Patched hash BUILD to add missing copts"
            fi
          fi
      
      # ===================== 单独处理：删除 hwloc.BUILD 中的 topology-x86.c =====================
      - name: Remove topology-x86.c from hwloc BUILD template (with before/after comparison)
        run: |
          HWBUILD="/tmp/tensorflow/third_party/xla/third_party/hwloc/hwloc.BUILD"
          if [ ! -f "$HWBUILD" ]; then
            echo "❌ $HWBUILD not found, skipping"
            exit 0
          fi

          echo "=== BEFORE: lines containing topology-x86.c / topology-x86_64.c ==="
          grep -n -H 'topology-x86\(_64\)\{0,1\}\.c' "$HWBUILD" | tee /tmp/hwloc_x86_lines_before.txt
          if [ ! -s /tmp/hwloc_x86_lines_before.txt ]; then
            echo "✅ No topology-x86 lines found, nothing to do."
            exit 0
          fi

          # 备份
          cp "$HWBUILD" "$HWBUILD.bak"

          # 删除所有包含 topology-x86.c 或 topology-x86_64.c 的行
          sed -i '/topology-x86\(_64\)\{0,1\}\.c/d' "$HWBUILD"

          # 清理可能出现的语法问题（空列表、多余逗号等）
          sed -i 's/\[\s*\]/[]/g' "$HWBUILD"
          sed -i 's/,\s*,/,/g' "$HWBUILD"
          sed -i 's/\[\s*,/[/g' "$HWBUILD"
          sed -i 's/,\s*\]/]/g' "$HWBUILD"

          echo "=== AFTER: the same lines (original line numbers) ==="
          while IFS=: read file line rest; do
            if [ -f "$file" ]; then
              new_line=$(sed -n "${line}p" "$file" 2>/dev/null)
              if [ -z "$new_line" ]; then
                echo "$file:$line: [LINE DELETED]"
              else
                echo "$file:$line: $new_line"
              fi
            else
              echo "$file:$line: [FILE MISSING]"
            fi
          done < /tmp/hwloc_x86_lines_before.txt
          echo "✅ topology-x86.c removal completed."
      # ========================================================================================

      - name: Fetch hwloc and apply fixes
        run: |
          WORKSPACE_BZL="/tmp/tensorflow/third_party/xla/third_party/hwloc/workspace.bzl"
          HW_URL=$(grep -oP 'urls\s*=\s*tf_mirror_urls\s*\(\s*"\K[^"]+' "$WORKSPACE_BZL" | head -1)
          HW_SHA256=$(grep -oP 'sha256\s*=\s*"\K[^"]+' "$WORKSPACE_BZL")
          HW_STRIP=$(grep -oP 'strip_prefix\s*=\s*"\K[^"]+' "$WORKSPACE_BZL" || true)
          HW_TAG="$HW_STRIP"  # strip_prefix 即 git tag
          echo "✅ URL: $HW_URL  SHA256: $HW_SHA256  STRIP: $HW_STRIP"

          # 下载并解压 tarball（包含所有 autotools 生成文件）
          wget -q "$HW_URL" -O /tmp/hwloc.tar.gz
          echo "$HW_SHA256  /tmp/hwloc.tar.gz" | sha256sum -c --status || exit 1
          tar -xzf /tmp/hwloc.tar.gz -C /tmp/
          mv "/tmp/$HW_STRIP" /tmp/hwloc

          # 从 Git 仅提取 Android 专用 static-components.h
          git clone --depth 1 --branch "$HW_TAG" https://github.com/open-mpi/hwloc.git /tmp/hwloc_git
          cp /tmp/hwloc_git/contrib/android/include/static-components.h /tmp/hwloc/hwloc/static-components.h
          rm -rf /tmp/hwloc_git

          # 合并 TensorFlow 构建配置
          cp -r /tmp/tensorflow/third_party/xla/third_party/hwloc/* /tmp/hwloc/
          cp /tmp/hwloc/hwloc.BUILD /tmp/hwloc/BUILD.bazel
          printf '\nexports_files(["static-components.h"])\n' >> /tmp/hwloc/BUILD.bazel
          touch /tmp/hwloc/WORKSPACE

          # 修补 BUILD.bazel（单行 Python，无缩进问题）
          python3 -c "import re; c=open('/tmp/hwloc/BUILD.bazel').read(); c=re.sub(r'expand_template\(\s*\n\s*name = \"move_static_components_h\".*?\n\s*\)\s*\n?', '', c, flags=re.DOTALL); c=c.replace('\"//conditions:default\": _INCLUDE_HWLOC_AUTOIGEN_CONFIG_H_COMMON_SUBS', '\"//conditions:default\": _INCLUDE_HWLOC_AUTOIGEN_CONFIG_H_LINUX_SUBS'); c=re.sub(r'^.*topology-x86(?:_64)?\.c.*\n?', '', c, flags=re.MULTILINE); c=c.replace('\"//conditions:default\": []', '\"//conditions:default\": [\n        \"hwloc/topology-linux.c\",\n        \"include/hwloc/linux.h\",\n    ]'); c=c.replace('\"-Wno-vla\"]', '\"-Wno-vla\", \"-Wno-static-inline\"]'); c=re.sub(r',\s*,', ',', c); c=re.sub(r'\[\s*,', '[', c); c=re.sub(r',\s*\]', ']', c); c=re.sub(r'\[\s*\]', '[]', c); open('/tmp/hwloc/BUILD.bazel','w').write(c); print('✅ BUILD.bazel patched')"

          # 修补 topology-linux.c
          LINUX_SRC="/tmp/hwloc/hwloc/topology-linux.c"
          if [ -f "$LINUX_SRC" ]; then
            sed -i '/#include "private\/autogen\/config.h"/a #undef HAVE_DECL_PTHREAD_SETAFFINITY_NP\n#define HAVE_DECL_PTHREAD_SETAFFINITY_NP 0\n#undef HAVE_DECL_PTHREAD_GETAFFINITY_NP\n#define HAVE_DECL_PTHREAD_GETAFFINITY_NP 0' "$LINUX_SRC"
            echo "Patched topology-linux.c"
          else
            echo "topology-linux.c not found, skipping"
          fi

          echo "=== Final BUILD.bazel content ==="
          cat /tmp/hwloc/BUILD.bazel

      # ===================== 使用源码路径添加 fixedpoint 依赖 =====================
      - name: Add fixedpoint dep to existing deps list
        run: |
          BUILD_FILE="/tmp/tensorflow/tensorflow/core/BUILD"
          cp "$BUILD_FILE" "$BUILD_FILE.bak"

          export BUILD_FILE
          python3 << 'PYEOF'
          import os, re

          build_file = os.environ['BUILD_FILE']
          with open(build_file, 'r') as f:
              content = f.read()

          # 在 portable_tensorflow_lib_lite 规则的 deps = [ 之后立即插入依赖项
          pattern = r'(name\s*=\s*"portable_tensorflow_lib_lite".*?deps\s*=\s*\[)'
          replacement = r'\1\n        "@xla//xla/tsl/framework/fixedpoint",'
          new_content, count = re.subn(pattern, replacement, content, flags=re.DOTALL)

          if count == 0:
              raise Exception("Could not find deps list for portable_tensorflow_lib_lite")

          with open(build_file, 'w') as f:
              f.write(new_content)
          print("✅ Added fixedpoint dep to existing deps")
          PYEOF

          echo "=== Full patched BUILD file ==="
          cat "$BUILD_FILE"

          echo "=== Verification ==="
          # 检查规则范围内只出现一次 deps 定义
          RULE_BLOCK=$(grep -A 40 'name = "portable_tensorflow_lib_lite"' "$BUILD_FILE")
          DEPS_COUNT=$(echo "$RULE_BLOCK" | grep -c '^\s*deps\s*=' || true)
          if [ "$DEPS_COUNT" -ne 1 ]; then
            echo "❌ Found $DEPS_COUNT deps definitions (expected 1)"
            exit 1
          fi

          if echo "$RULE_BLOCK" | grep -q 'fixedpoint'; then
            echo "✅ Dependency inserted and verified"
          else
            echo "❌ fixedpoint not found in rule"
            exit 1
          fi
      # ========================================================================================

      # ===================== 修改点：将 KleidiAI 依赖加入 tflite_deps =====================
      - name: Add KleidiAI deps to libtensorflowlite_jni.so (tflite_deps)
        run: |
          JNI_BUILD="tflite/java/BUILD"
          if [ ! -f "$JNI_BUILD" ]; then
            echo "❌ $JNI_BUILD not found"
            exit 1
          fi
          cp "$JNI_BUILD" "$JNI_BUILD.bak"
          python3 << 'PYEOF'
          import re
          file = "tflite/java/BUILD"
          with open(file, "r") as f:
              content = f.read()
          # 匹配 tflite_deps 而非 deps
          pattern = r'(name\s*=\s*"libtensorflowlite_jni\.so".*?\btflite_deps\s*=\s*\[)([^\]]*?)(\])'
          def add_deps(m):
              inner = m.group(2).strip()
              needed = ['"@KleidiAI//:common"', '"@KleidiAI//:matmul"']
              if all(d in inner for d in needed):
                  return m.group(0)
              if inner and not inner.endswith(','):
                  inner += ','
              inner += '\n        "@KleidiAI//:common",\n        "@KleidiAI//:matmul",'
              return m.group(1) + inner + m.group(3)
          new_content, count = re.subn(pattern, add_deps, content, flags=re.DOTALL)
          if count == 0:
              print("⚠️ Could not find libtensorflowlite_jni.so target")
              exit(1)
          with open(file, "w") as f:
              f.write(new_content)
          print("✅ Added KleidiAI deps to libtensorflowlite_jni.so (tflite_deps)")
          PYEOF
          echo "=== Verify ==="
          grep -A 30 'name = "libtensorflowlite_jni.so"' "$JNI_BUILD" | head -35
      # ========================================================================================

      # ---------- 克隆 XNNPACK ----------
      - name: Clone latest XNNPACK
        run: |
          git clone --depth 1 https://github.com/google/XNNPACK.git /tmp/xnnpack
          if grep -rq "xnn_define_static_constant_pad_v2" /tmp/xnnpack/include; then
            echo "✅ xnn_define_static_constant_pad_v2 found"
          else
            echo "❌ Required function not found"
            exit 1
          fi
          echo "XNNPACK cloned to /tmp/xnnpack"

      # ---------- 从 DownloadKleidiAI.cmake 获取 KleidiAI commit ----------
      - name: Extract KleidiAI commit from XNNPACK
        id: kleidiai_commit
        run: |
          CMAKE_FILE="/tmp/xnnpack/cmake/DownloadKleidiAI.cmake"
          if [ -f "$CMAKE_FILE" ]; then
            COMMIT=$(grep -oP 'archive/\K[a-f0-9]+' "$CMAKE_FILE" | head -1)
            if [ -z "$COMMIT" ]; then
              echo "⚠️ Could not parse commit, using fallback"
              COMMIT="$KLEIDIAI_COMMIT"
            fi
          else
            echo "⚠️ DownloadKleidiAI.cmake not found, using fallback"
            COMMIT="$KLEIDIAI_COMMIT"
          fi
          echo "KLEIDIAI_COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "✅ Using KleidiAI commit: $COMMIT"

      # ---------- 克隆 KleidiAI ----------
      - name: Clone KleidiAI
        run: |
          git clone https://github.com/ARM-software/kleidiai.git /tmp/kleidiai
          cd /tmp/kleidiai
          git checkout $KLEIDIAI_COMMIT
          echo "KleidiAI ready at $(git rev-parse HEAD)"

      # ---------- 修复 KleidiAI 目录结构 ----------
      - name: Fix KleidiAI directory layout
        run: |
          cd /tmp/kleidiai
          if [ -d src/kai ]; then
            echo "✅ Already have src/kai"
          elif [ -d kai ]; then
            echo "Found kai at root, moving into src/kai..."
            mkdir -p src
            mv kai src/
          else
            echo "❌ Neither src/kai nor kai found"
            find . -maxdepth 2 -type d
            exit 1
          fi

      # ---------- 准备 @KleidiAI 仓库 ----------
      - name: Prepare @KleidiAI repository
        run: |
          rm -rf /tmp/kleidiai_repo
          cp -r /tmp/kleidiai /tmp/kleidiai_repo
          # 将源文件复制到 kai/ukernels/matmul 包内，使其能被 filegroup 匹配
          mkdir -p /tmp/kleidiai_repo/kai/ukernels/matmul
          cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/*.c /tmp/kleidiai_repo/kai/ukernels/matmul/ 2>/dev/null || true
          cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/*.S /tmp/kleidiai_repo/kai/ukernels/matmul/ 2>/dev/null || true
          cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/*.h /tmp/kleidiai_repo/kai/ukernels/matmul/ 2>/dev/null || true

          # 同时复制 pack 子目录下的文件（如果需要）
          if [ -d /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack ]; then
            mkdir -p /tmp/kleidiai_repo/kai/ukernels/matmul/pack
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack/*.c /tmp/kleidiai_repo/kai/ukernels/matmul/pack/ 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack/*.S /tmp/kleidiai_repo/kai/ukernels/matmul/pack/ 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack/*.h /tmp/kleidiai_repo/kai/ukernels/matmul/pack/ 2>/dev/null || true
          fi
          # 子目录 imatmul_clamp_*, matmul_clamp_* 等（如果有多个子目录，也可类似处理，或统一用 glob）
          for subdir in $(find /tmp/kleidiai_repo/src/kai/ukernels/matmul -mindepth 1 -maxdepth 1 -type d); do
            subname=$(basename "$subdir")
            mkdir -p "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname"
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/$subname/*.c "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname/" 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/$subname/*.S "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname/" 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/$subname/*.h "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname/" 2>/dev/null || true
          done

          echo "=== KleidiAI repo tree after copy ==="
          find /tmp/kleidiai_repo -type f \( -name '*.h' -o -name '*.c' -o -name '*.S' -o -name 'BUILD*' \) | sort

      - name: Verify qsi4cxp sources exist
        run: |
          cd /tmp/kleidiai_repo/src/kai
          echo "=== Searching for qsi4cxp files ==="
          find . -type f \( -name '*qsi4cxp*.c' -o -name '*qsi4cxp*.S' \) | tee /tmp/qsi4cxp_files.txt
          if [ ! -s /tmp/qsi4cxp_files.txt ]; then
            echo "❌ FATAL: No qsi4cxp implementation files found!"
            echo "This KleidiAI commit does not contain qsi4cxp."
            echo "Please update KLEIDIAI_COMMIT to a version that includes it."
            exit 1
          else
            echo "✅ qsi4cxp files found:"
            cat /tmp/qsi4cxp_files.txt
          fi

      # 【修改 2】KleidiAI BUILD：用自定义 config_setting 匹配 Android arm64，取代 @platforms//cpu:aarch64
      - name: Create BUILD files for @KleidiAI
        run: |
          REPO=/tmp/kleidiai_repo
          cat > $REPO/BUILD.bazel << 'EOF'
          package(default_visibility = ["//visibility:public"])

          # 匹配 Android ARM64 的自定义条件
          config_setting(
              name = "is_android_arm64",
              values = {
                  "cpu": "arm64-v8a",
                  "define": "xnn_enable_kleidiai=true",
              },
          )

          cc_library(
              name = "common",
              hdrs = glob(["src/kai/**/*.h", "kai/ukernels/**/*.h"]),
              srcs = select({
                  ":is_android_arm64": [
                      "src/kai/kai_common_sme_asm.S",
                      "src/kai/kai_common_sve_asm.S",
                  ],
                  "//conditions:default": [],
              }),
              includes = ["src", "."],
              alwayslink = 1,
              copts = select({
                  ":is_android_arm64": [
                      "-march=armv8.2-a+dotprod+i8mm+fp16+bf16+sme2+sve2",
                  ],
                  "//conditions:default": [],
              }),
          )

          cc_library(
              name = "matmul",
              srcs = select({
                  ":is_android_arm64": ["@KleidiAI//kai/ukernels/matmul:matmul_srcs"],
                  "//conditions:default": [],
              }),
              hdrs = select({
                  ":is_android_arm64": ["@KleidiAI//kai/ukernels/matmul:matmul_hdrs"],
                  "//conditions:default": [],
              }),
              includes = ["src", "."],
              alwayslink = 1,
              copts = select({
                  ":is_android_arm64": [
                      "-march=armv8.2-a+dotprod+i8mm+fp16+bf16+sme2+sve2",
                      "-fno-tree-vectorize",
                  ],
                  "//conditions:default": [],
              }),
              deps = [":common"],
          )
          EOF
      
          cat > $REPO/kai/ukernels/matmul/BUILD.bazel << 'EOF'
          package(default_visibility = ["//visibility:public"])
          filegroup(name = "matmul_srcs", srcs = glob(["**/*.c", "**/*.S"], exclude = ["BUILD.bazel"]))
          filegroup(name = "matmul_hdrs", srcs = glob(["**/*.h"]))
          alias(name = "matmul", actual = "//:matmul")
          EOF
      
          echo "=== @KleidiAI root BUILD ==="
          cat $REPO/BUILD.bazel
          echo "=== @KleidiAI matmul BUILD ==="
          cat $REPO/kai/ukernels/matmul/BUILD.bazel
          
      # ---------- 修补 XNNPACK BUILD（给 packing/pack_lh 加 common 依赖） ----------
      - name: Patch XNNPACK BUILD – add KleidiAI deps and alwayslink
        run: |
          cd /tmp/xnnpack
          python3 << 'PYEOF'
          import re

          with open('BUILD.bazel', 'r') as f:
              content = f.read()

          deps_needed = ['"@KleidiAI//:common"', '"@KleidiAI//:matmul"']
          targets_with_alwayslink = ['XNNPACK', 'packing', 'pack_lh']

          # 1. 更新 MICROKERNEL_DEPS
          def update_microkernel_deps(m):
              inner = m.group(1)
              for dep in deps_needed:
                  if dep not in inner:
                      if inner.rstrip() and not inner.rstrip().endswith(','):
                          inner = inner.rstrip() + ',\n    '
                      elif inner.rstrip():
                          inner = inner.rstrip() + '\n    '
                      inner += dep
              return 'MICROKERNEL_DEPS = [' + inner + ']'

          content = re.sub(
              r'MICROKERNEL_DEPS\s*=\s*\[(.*?)\]',
              update_microkernel_deps,
              content,
              flags=re.DOTALL,
          )

          # 2. 更新所有 xnnpack_if_kleidiai_enabled 列表
          def update_kleidiai_list(m):
              inner = m.group(1)
              for dep in deps_needed:
                  if dep not in inner:
                      if inner.rstrip() and not inner.rstrip().endswith(','):
                          inner = inner.rstrip() + ',\n        '
                      elif inner.rstrip():
                          inner = inner.rstrip() + '\n        '
                      inner += dep
              return 'xnnpack_if_kleidiai_enabled([' + inner + '])'

          content = re.sub(
              r'xnnpack_if_kleidiai_enabled\s*\(\s*\[([^\]]*?)\]\s*\)',
              update_kleidiai_list,
              content,
              flags=re.DOTALL,
          )

          # 3. 为特定目标添加 alwayslink = 1
          macro_prefixes = ['xnnpack_cc_library(', 'xnnpack_cxx_library(']

          def add_alwayslink_for_target(content, target_name):
              name_pattern = rf'name\s*=\s*"{target_name}"'
              match = re.search(name_pattern, content)
              if not match:
                  return content

              start = match.start()
              lib_start = -1
              for prefix in macro_prefixes:
                  pos = content.rfind(prefix, 0, start)
                  if pos > lib_start:
                      lib_start = pos
              if lib_start == -1:
                  return content

              depth = 0
              i = lib_start
              while i < len(content):
                  if content[i] == '(':
                      depth += 1
                  elif content[i] == ')':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
                  i += 1
              else:
                  return content

              macro_call = content[lib_start:end+1]
              if 'alwayslink' in macro_call:
                  return content

              before_paren = macro_call[:-1]
              stripped = before_paren.rstrip()
              if not stripped.endswith(','):
                  insert = ',\n    alwayslink = 1'
              else:
                  insert = '\n    alwayslink = 1'
              new_macro_call = before_paren + insert + ')'

              content = content[:lib_start] + new_macro_call + content[end+1:]
              return content

          for target in targets_with_alwayslink:
              content = add_alwayslink_for_target(content, target)

          with open('BUILD.bazel', 'w') as f:
              f.write(content)

          print("✅ Updated MICROKERNEL_DEPS and xnnpack_if_kleidiai_enabled lists")
          print("✅ Added alwayslink = 1 to:", targets_with_alwayslink)
          PYEOF

          echo "=== MICROKERNEL_DEPS ==="
          grep -A 20 'MICROKERNEL_DEPS' BUILD.bazel | head -25

          echo "=== Modified rules for XNNPACK, packing, pack_lh ==="
          python3 << 'PYEOF'
          import re

          with open('BUILD.bazel', 'r') as f:
              content = f.read()

          for name in ['XNNPACK', 'packing', 'pack_lh']:
              # 查找 name = "xxx"
              match = re.search(rf'name\s*=\s*"{name}"', content)
              if not match:
                  print(f"⚠️ Target {name} not found")
                  continue
              start = match.start()
              # 向前找宏调用开始
              prefixes = ['xnnpack_cc_library(', 'xnnpack_cxx_library(']
              lib_start = -1
              for p in prefixes:
                  pos = content.rfind(p, 0, start)
                  if pos > lib_start:
                      lib_start = pos
              if lib_start == -1:
                  continue
              # 配对括号
              depth = 0
              i = lib_start
              while i < len(content):
                  if content[i] == '(':
                      depth += 1
                  elif content[i] == ')':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
                  i += 1
              else:
                  continue
              block = content[lib_start:end+1]
              print(f"\n=== {name} ===")
              print(block)
          PYEOF

      # ---------- Inject overrides into build script ----------  ← 【修改 3】同时注入 --noexperimental_cc_shared_library
      - name: Inject overrides into build script
        run: |
          sed -i 's/bazel build/bazel build --override_repository=XNNPACK=\/tmp\/xnnpack --override_repository=KleidiAI=\/tmp\/kleidiai_repo --noexperimental_cc_shared_library --noincompatible_remove_legacy_whole_archive /g' ci/build_android_package.sh
          echo "✅ Injected XNNPACK, KleidiAI overrides and static link flags"
          grep -n 'bazel build' ci/build_android_package.sh | head -5

      # ---------- 环境配置与构建（不涉及 bazel 命令的部分提前） ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip -d /tmp
          NDK_PATH=/tmp/android-ndk-${NDK_VERSION}
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          ls -la $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang* || exit 1
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}

      - name: Export Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      # 以下修改 .bazelrc、配置等均不涉及 bazel 命令，提前至此
      - name: Configure .bazelrc for NDK and overrides   # <-- 修改：在此统一配置 NDK 和仓库覆盖
        run: |
          echo "build --repo_env=ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> .bazelrc
          echo "build --action_env=ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> .bazelrc
          # 将覆盖仓库写入 .bazelrc，确保所有构建自动应用
          echo "build --override_repository=XNNPACK=/tmp/xnnpack" >> .bazelrc
          echo "build --override_repository=KleidiAI=/tmp/kleidiai_repo" >> .bazelrc
          echo "build --override_repository=org_tensorflow=/tmp/tensorflow" >> .bazelrc
          echo "build --override_repository=hwloc=/tmp/hwloc" >> .bazelrc
          echo "build --define=xnn_enable_kleidiai=true" >> .bazelrc

      - name: Disable layering_check globally and for monolithic config
        run: |
          echo "build --features=-layering_check" >> .bazelrc
          echo "build:monolithic --features=-layering_check" >> .bazelrc

      # 在 Enable KleidiAI for arm64 + fix hwloc x86 步骤中
      - name: Enable KleidiAI for arm64 (and disable for x86) + fix hwloc x86
        run: |
          echo "build:android_arm64 --define=xnn_enable_kleidiai=true"   >> .bazelrc
          echo "build:android_arm   --define=xnn_enable_kleidiai=false"  >> .bazelrc
          echo "build:android_x86   --define=xnn_enable_kleidiai=false"  >> .bazelrc
          echo "build:android_x86_64 --define=xnn_enable_kleidiai=false" >> .bazelrc
      
          # 修复 hwloc 的 pthread affinity 编译错误（所有 Android 架构）
          echo "build:android_arm64 --copt=-DHAVE_DECL_PTHREAD_SETAFFINITY_NP=0" >> .bazelrc
          echo "build:android_arm64 --copt=-DHAVE_DECL_PTHREAD_GETAFFINITY_NP=0" >> .bazelrc
          echo "build:android_arm   --copt=-DHAVE_DECL_PTHREAD_SETAFFINITY_NP=0" >> .bazelrc
          echo "build:android_arm   --copt=-DHAVE_DECL_PTHREAD_GETAFFINITY_NP=0" >> .bazelrc
          echo "build:android_x86   --copt=-DHAVE_DECL_PTHREAD_SETAFFINITY_NP=0" >> .bazelrc
          echo "build:android_x86   --copt=-DHAVE_DECL_PTHREAD_GETAFFINITY_NP=0" >> .bazelrc
          echo "build:android_x86_64 --copt=-DHAVE_DECL_PTHREAD_SETAFFINITY_NP=0" >> .bazelrc
          echo "build:android_x86_64 --copt=-DHAVE_DECL_PTHREAD_GETAFFINITY_NP=0" >> .bazelrc
      
          echo "build:kleidiai_query --define=xnn_enable_kleidiai=true"  >> .bazelrc
          echo "✅ KleidiAI: arm64=true, x86/x86_64=false, pthread affinity fixed for all Android archs"

      # 【修改 1】关闭 cc_shared_library 实验特性，让 alwayslink 回归传统 .a 静态链接
      - name: Force static linking for KleidiAI symbols
        run: |
          echo "build:android_arm64 --noexperimental_cc_shared_library" >> .bazelrc
          echo "build:android_arm64 --noincompatible_remove_legacy_whole_archive" >> .bazelrc
          echo "✅ Disabled cc_shared_library for android_arm64 to force .a linking"

      - name: Verify Android paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la $ANDROID_HOME/platforms || true
          ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang* || true

      - name: Configure TensorFlow for Android
        run: |
          export TF_NEED_ANDROID=1
          export TF_SET_ANDROID_WORKSPACE=1
          if [ -f ./configure.py ]; then
            yes "" | python3 ./configure.py
          else
            echo "No configure.py found; assuming WORKSPACE is already configured."
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_API_LEVEL: ${{ env.ANDROID_API_LEVEL }}
          TF_NEED_ANDROID: 1
          TF_SET_ANDROID_WORKSPACE: 1

      # 打印当前的 .bazelrc 以便调试
      - name: Dump .bazelrc after configure
        run: |
          echo "=== Current .bazelrc ==="
          cat .bazelrc

      - name: Show api_level before fix
        run: |
          echo "=== Before fix ==="
          grep -n "api_level" WORKSPACE || echo "No api_level found"

      - name: Fix WORKSPACE api_level (float to int)
        run: |
          cp WORKSPACE WORKSPACE.bak
          sed -i 's/\(api_level\s*=\s*\)[0-9]\+\.[0-9]\+/\136/g' WORKSPACE
          echo "=== After fix ==="
          grep -n "api_level" WORKSPACE || echo "No api_level found"
          if grep -q "api_level.*\.[0-9]" WORKSPACE; then
            echo "Warning: Floating api_level still present, applying additional fix"
            sed -i 's/\(api_level\s*=\s*\)[0-9]*\.[0-9]*/\136/g' WORKSPACE
            grep -n "api_level" WORKSPACE
          fi

      # 移除脚本中可能导致问题的 SSE 标志（它们是 x86 专用的禁用标志）
      - name: Remove unsupported SSE flags from build script
        run: |
          cp ci/build_android_package.sh ci/build_android_package.sh.bak
          sed -i '/--copt=-mno-sse4/d' ci/build_android_package.sh
          echo "Patched script after removing SSE flags:"
          grep -n -- '--copt' ci/build_android_package.sh || echo "No --copt flags left"

      # 以下两个 sed 修改（强制禁用 layering_check 和启用 XLA）不涉及 bazel，提前至此
      # select-tf-ops 禁用 layering_check
      - name: Force disable layering_check for select-tf-ops build
        run: |
          sed -i '/\/\/tflite\/java:tensorflow-lite-select-tf-ops/ s/$/ --features=-layering_check/' ci/build_android_package.sh
          echo "✅ Appended --features=-layering_check to select-tf-ops build line"

      # ======================= 强制启用 XLA 支持 =======================
      - name: Enable XLA support for Android
        run: |
          echo "=== Enabling XLA for Android builds ==="
          sed -i 's/--define=with_xla_support=false/--define=with_xla_support=true/' .bazelrc
          echo "=== Modified .bazelrc (android config line) ==="
          grep -n 'with_xla_support' .bazelrc || echo "No with_xla_support lines found"
      # ================================================================

      # ---------- 至此，所有不涉及 bazel 命令的修改文件步骤已完成，接下来安装 bazel ----------
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazel-version: 7.0.0

      # ===================== 新增：提前清空分析缓存，确保后续所有操作使用干净缓存 =====================
      - name: Purge Bazel analysis cache before any fetch/build
        run: |
          echo "=== Purging Bazel analysis cache to ensure all BUILD/bzl/tpl changes are picked up ==="
          bazel clean --expunge_async
          echo "✅ Cache purged. All subsequent bazel commands will re-analyze everything."

      - name: Verify Android C++ toolchain for all architectures
        run: |
          # 定义架构与对应平台的映射
          declare -A ARCH_MAP
          ARCH_MAP=(
            ["arm64-v8a"]="@org_tensorflow//tensorflow/tools/toolchains/android:arm64-v8a"
            ["armeabi-v7a"]="@org_tensorflow//tensorflow/tools/toolchains/android:armeabi-v7a"
            ["x86"]="@org_tensorflow//tensorflow/tools/toolchains/android:x86"
            ["x86_64"]="@org_tensorflow//tensorflow/tools/toolchains/android:x86_64"
          )
      
          for cpu in "${!ARCH_MAP[@]}"; do
            platform="${ARCH_MAP[$cpu]}"
            echo "=== Checking C++ toolchain for cpu=$cpu, platform=$platform ==="
            bazel cquery \
              --cpu="$cpu" \
              --platforms="$platform" \
              --toolchain_resolution_debug='@bazel_tools//tools/cpp:toolchain_type' \
              @bazel_tools//tools/cpp:toolchain_type \
              --output=build 2>&1 | tee "/tmp/android_toolchain_check_${cpu}.log"
      
            if grep -q -E "No matching toolchains|Unable to find a CC toolchain" "/tmp/android_toolchain_check_${cpu}.log"; then
              echo "❌ Android C++ toolchain resolution FAILED for $cpu!"
              grep -A10 -B5 "No matching toolchains\|Unable to find a CC toolchain" "/tmp/android_toolchain_check_${cpu}.log"
              exit 1
            else
              echo "✅ Android C++ toolchain seems resolvable for $cpu."
            fi
          done

      # ======================= 以下步骤涉及 bazel fetch / info / build，保持原顺序 =======================
      # 修复 libwebp：删除其 BUILD 文件中的 -msse4.1 选项
      - name: Fetch libwebp and thoroughly remove SSE41 options (with full file dump)
        run: |
          bazel fetch @libwebp//...
          OUTPUT_BASE=$(bazel info output_base)
          WEBP_PATH="${OUTPUT_BASE}/external/libwebp"
          if [ -d "$WEBP_PATH" ]; then
            echo "Found libwebp at $WEBP_PATH"
            export BUILD_FILE="$WEBP_PATH/BUILD.bazel"
            cp "$BUILD_FILE" "$BUILD_FILE.bak"
            # 全局删除包含 msse4 或 WEBP_HAVE_SSE41 的行（兜底）
            sed -i '/msse4\|WEBP_HAVE_SSE41/Id' "$BUILD_FILE"
            # 使用 Python 精确删除 webp 目标的 copts 属性
            python3 << 'PYEOF'
          import os, re
          build_file = os.environ["BUILD_FILE"]
          with open(build_file, "r") as f:
              content = f.read()
          # 匹配 name = "webp" 的 cc_library 块
          pattern = r'(cc_library\s*\(\s*name\s*=\s*"webp".*?)(\))'
          m = re.search(pattern, content, re.DOTALL)
          if m:
              rule = m.group(0)
              # 移除 copts 属性（可能跨多行）
              rule = re.sub(r'copts\s*=\s*[^,\n]*(,\s*)?', '', rule)
              # 清理多余逗号
              rule = re.sub(r',\s*,', ',', rule)
              rule = re.sub(r'\[\s*,', '[', rule)
              rule = re.sub(r',\s*\]', ']', rule)
              content = content[:m.start()] + rule + content[m.end():]
              with open(build_file, "w") as f:
                  f.write(content)
              print("✅ Removed copts from libwebp 'webp' target")
          else:
              print("⚠️ 'webp' target not found, relying on global sed only")
          PYEOF
            # 打印完整的 BUILD 文件内容以进行校验
            echo "=== Final content of libwebp BUILD.bazel ==="
            cat "$BUILD_FILE"
          else
            echo "libwebp not found"
            exit 1
          fi

      # 修复 xla 中所有文件里的 -msse3 标志，并直接修补 stats_calculator_portable 目标
      - name: Fetch xla and remove -msse3 (patch stats_calculator_portable directly)
        run: |
          # fetch 可能因缺少 rc_number 等仓库而失败，但 xla 目录通常已存在
          bazel fetch @xla//... || true
          OUTPUT_BASE=$(bazel info output_base)
          XLA_PATH="${OUTPUT_BASE}/external/xla"
          if [ -d "$XLA_PATH" ]; then
            echo "Found xla at $XLA_PATH"

            # 1. 修补 tsl.bzl（保留原有修补）
            TSL_BZL_PATH="$XLA_PATH/xla/tsl/tsl.bzl"
            if [ -f "$TSL_BZL_PATH" ]; then
              cp "$TSL_BZL_PATH" "$TSL_BZL_PATH.bak"
              sed -i '/if_linux_x86_64.*-msse3/d' "$TSL_BZL_PATH"
              if grep -q -- '-msse3' "$TSL_BZL_PATH"; then
                echo "ERROR: -msse3 still in tsl.bzl"
                exit 1
              fi
              echo "✅ tsl.bzl patched"
            fi

            # 2. 直接修补 stats_calculator_portable 所在的 BUILD 文件
            STATS_BUILD="$XLA_PATH/xla/tsl/util/BUILD"
            if [ -f "$STATS_BUILD" ]; then
              echo "=== BEFORE: stats_calculator_portable target ==="
              grep -n -B5 -A25 'name = "stats_calculator_portable"' "$STATS_BUILD"
              cp "$STATS_BUILD" "$STATS_BUILD.bak"
              # 删除所有包含 -msse3 的行
              sed -i '/-msse3/d' "$STATS_BUILD"
              # 如果 copts 变成空列表，删除该行
              sed -i '/copts\s*=\s*\[\s*\]/d' "$STATS_BUILD"
              echo "=== AFTER: stats_calculator_portable target ==="
              grep -n -B5 -A25 'name = "stats_calculator_portable"' "$STATS_BUILD"
              echo "✅ stats_calculator_portable patched"
            else
              echo "stats_calculator_portable BUILD not found at $STATS_BUILD"
            fi

            # 3. 全局清理所有剩余 -msse3（兜底）
            echo "=== Global cleanup of remaining -msse3 ==="
            find "$XLA_PATH" -type f \( -name "*.o" -o -name "*.a" -o -name "*.so" -o -name "*.pyc" \) -prune -o -type f -exec grep -l -- '-msse3' {} \; | tee /tmp/xla_sse3_files.txt
            if [ -s /tmp/xla_sse3_files.txt ]; then
              xargs -a /tmp/xla_sse3_files.txt sed -i '/-msse3/d'
              echo "✅ Cleaned extra files"
            else
              echo "✅ No remaining -msse3"
            fi
          else
            echo "Warning: xla not found at $XLA_PATH"
          fi

      # ===================== 新增最终清理步骤 =====================
      # 全局 SSE 清理（精确对比修改前后）
      - name: Final cleanup of SSE options with before/after comparison
        run: |
          OUTPUT_BASE=$(bazel info output_base)
          EXT_DIR="${OUTPUT_BASE}/external"
          if [ -d "$EXT_DIR" ]; then
            echo "Scanning all external repos for SSE options (msse, WEBP_HAVE_SSE41)..."
            # 排除 XNNPACK 和 KleidiAI 仓库
            find "$EXT_DIR" -type d \( -name "XNNPACK" -o -name "KleidiAI" -o -name "kleidiai_repo" \) -prune -o \
              -type f \( -name "BUILD" -o -name "BUILD.bazel" -o -name "*.bzl" \) \
              -exec grep -l -E 'msse|WEBP_HAVE_SSE41' {} \; | tee /tmp/sse_files.txt

            if [ -s /tmp/sse_files.txt ]; then
              # 修改前：显示匹配行及上下文
              echo "=== BEFORE: Lines containing msse/WEBP_HAVE_SSE41 (with context) ==="
              xargs -a /tmp/sse_files.txt grep -n -H -C3 -E 'msse|WEBP_HAVE_SSE41'

              # 记录所有匹配行信息（文件名:行号:内容）
              xargs -a /tmp/sse_files.txt grep -n -H -E 'msse|WEBP_HAVE_SSE41' > /tmp/sse_lines_before.txt

              # 执行删除（所有文件均为整行删除，无 .tpl）
              xargs -a /tmp/sse_files.txt sed -i '/msse\|WEBP_HAVE_SSE41/Id'

              # 修改后：逐行检查
              echo "=== AFTER: The same lines after removal ==="
              while IFS=: read file line rest; do
                if [ -f "$file" ]; then
                  new_line=$(sed -n "${line}p" "$file" 2>/dev/null)
                  if [ -z "$new_line" ]; then
                    echo "$file:$line: [LINE DELETED]"
                  else
                    echo "$file:$line: $new_line"
                  fi
                else
                  echo "$file:$line: [FILE MISSING]"
                fi
              done < /tmp/sse_lines_before.txt
              echo "✅ All SSE options removed from listed files."
            else
              echo "✅ No SSE options found in external repos (except XNNPACK/KleidiAI)."
            fi
          else
            echo "External directory not found, skipping"
          fi

      # ===================== 新增：提前修补 hwloc BUILD 模板（带前后对比） =====================
      - name: Patch hwloc BUILD template in xla (with before/after context)
        run: |
          bazel fetch @xla//... || true
          OUTPUT_BASE=$(bazel info output_base)
          HWLOC_TEMPLATE="${OUTPUT_BASE}/external/xla/third_party/hwloc/hwloc.BUILD"
          if [ -f "$HWLOC_TEMPLATE" ]; then
            echo "Found hwloc BUILD template: $HWLOC_TEMPLATE"
            echo "=== BEFORE: lines related to topology-x86 or -msse (with context) ==="
            grep -n -H -C3 -E 'topology-x86|-msse' "$HWLOC_TEMPLATE" || echo "(none found)"
            grep -n -H -E 'topology-x86|-msse' "$HWLOC_TEMPLATE" > /tmp/hwloc_lines_before.txt || true   # ← 添加 || true
            cp "$HWLOC_TEMPLATE" "$HWLOC_TEMPLATE.bak"
            sed -i '/topology-x86.*\.c/d' "$HWLOC_TEMPLATE"
            sed -i -e 's/-msse3//g' -e 's/-msse4\.1//g' -e 's/-msse4\.2//g' "$HWLOC_TEMPLATE"
            echo "=== AFTER: The same lines after modification ==="
            while IFS=: read file line rest; do
              if [ -f "$file" ]; then
                new_line=$(sed -n "${line}p" "$file" 2>/dev/null)
                if [ -z "$new_line" ]; then
                  echo "$file:$line: [LINE DELETED]"
                else
                  echo "$file:$line: $new_line"
                fi
              else
                echo "$file:$line: [FILE MISSING]"
              fi
            done < /tmp/hwloc_lines_before.txt
            echo "✅ hwloc BUILD template patched."
          else
            echo "hwloc BUILD template not found at $HWLOC_TEMPLATE, searching..."
            HWLOC_TEMPLATE=$(find "${OUTPUT_BASE}/external/xla" -name "hwloc.BUILD" | head -1)
            if [ -n "$HWLOC_TEMPLATE" ]; then
              echo "Found alternate: $HWLOC_TEMPLATE"
              grep -n -H -C3 -E 'topology-x86|-msse' "$HWLOC_TEMPLATE" || echo "(none found)"
              grep -n -H -E 'topology-x86|-msse' "$HWLOC_TEMPLATE" > /tmp/hwloc_lines_before.txt || true   # ← 添加 || true
              cp "$HWLOC_TEMPLATE" "$HWLOC_TEMPLATE.bak"
              sed -i '/topology-x86.*\.c/d' "$HWLOC_TEMPLATE"
              sed -i -e 's/-msse3//g' -e 's/-msse4\.1//g' -e 's/-msse4\.2//g' "$HWLOC_TEMPLATE"
              while IFS=: read file line rest; do
                if [ -f "$file" ]; then
                  new_line=$(sed -n "${line}p" "$file" 2>/dev/null)
                  if [ -z "$new_line" ]; then
                    echo "$file:$line: [LINE DELETED]"
                  else
                    echo "$file:$line: $new_line"
                  fi
                else
                  echo "$file:$line: [FILE MISSING]"
                fi
              done < /tmp/hwloc_lines_before.txt
              echo "✅ hwloc BUILD template patched (alternate)."
            else
              echo "❌ Critical: hwloc BUILD template not found anywhere. Build may fail."
              exit 1
            fi
          fi

      # 修复 hwloc
      - name: Fetch hwloc and apply fixes (with detailed output)
        run: |
          bazel fetch @hwloc//... || true
          OUTPUT_BASE=$(bazel info output_base)
          HWLOC_DIR="${OUTPUT_BASE}/external/hwloc"
          if [ -d "$HWLOC_DIR" ]; then
            echo "Found hwloc at $HWLOC_DIR"
            BUILD_FILE="$HWLOC_DIR/BUILD.bazel"
            if [ -f "$BUILD_FILE" ]; then
              cp "$BUILD_FILE" "$BUILD_FILE.bak"
              echo "=== BEFORE: lines related to topology-x86 (with context) ==="
              grep -n -C3 'topology-x86' "$BUILD_FILE" || echo "(no topology-x86 lines found)"
              echo "=== Removing lines containing topology-x86.c or topology-x86_64.c ==="
              grep -v 'topology-x86.*\.c' "$BUILD_FILE" > "$BUILD_FILE.tmp"
              mv "$BUILD_FILE.tmp" "$BUILD_FILE"
              echo "=== AFTER (first pass): remaining topology-x86 references ==="
              grep -n -C3 'topology-x86' "$BUILD_FILE" || echo "(none)"
              echo "=== Extra cleanup: directly deleting quoted file names ==="
              sed -i 's/"topology-x86\.c"//g; s/"topology-x86_64\.c"//g' "$BUILD_FILE"
              echo "=== Cleaning up empty entries and stray commas ==="
              sed -i 's/,\s*,/,/g; s/\[\s*,/[/g; s/,\s*\]/]/g; s/\[\s*\]/[]/g' "$BUILD_FILE"
              echo "=== FINAL: lines mentioning topology-x86 (should be empty or clean) ==="
              grep -n -C3 'topology-x86' "$BUILD_FILE" || echo "(none)"
            else
              echo "BUILD.bazel not found, skipping"
            fi

            # 修改 topology-linux.c 强制禁用 pthread affinity 函数
            LINUX_SRC="$HWLOC_DIR/hwloc/topology-linux.c"
            if [ -f "$LINUX_SRC" ]; then
              cp "$LINUX_SRC" "$LINUX_SRC.bak"
              echo "=== Patching $LINUX_SRC to disable pthread affinity ==="
              sed -i '/#include "private\/autogen\/config.h"/a #undef HAVE_DECL_PTHREAD_SETAFFINITY_NP\n#define HAVE_DECL_PTHREAD_SETAFFINITY_NP 0\n#undef HAVE_DECL_PTHREAD_GETAFFINITY_NP\n#define HAVE_DECL_PTHREAD_GETAFFINITY_NP 0' "$LINUX_SRC"
              echo "Patched topology-linux.c"
            else
              echo "topology-linux.c not found, skipping"
            fi
          else
            echo "hwloc directory not found, skipping"
          fi

      # ======================= 预热 XNNPACK（完全匹配最终打包参数） =======================
      - name: Pre-build XNNPACK for arm64 (compile check)
        run: |
          echo "=== Warming XNNPACK with same config as final package ==="
          # 使用与最终打包完全一致的编译模式、架构参数
          bazel build \
            --override_repository=XNNPACK=/tmp/xnnpack \
            --override_repository=KleidiAI=/tmp/kleidiai_repo \
            --noexperimental_cc_shared_library \
            --noincompatible_remove_legacy_whole_archive \
            -c opt \
            --cxxopt=--std=c++17 \
            --config=android_arm64 \
            --fat_apk_cpu=x86,x86_64,arm64-v8a,armeabi-v7a \
            @XNNPACK//:XNNPACK \
            || { echo "❌ XNNPACK build failed"; exit 1; }
      
          echo "✅ XNNPACK (arm64) compiled successfully with KleidiAI enabled."

          echo "=== Building KleidiAI matmul to verify symbols ==="
          bazel build \
            --override_repository=XNNPACK=/tmp/xnnpack \
            --override_repository=KleidiAI=/tmp/kleidiai_repo \
            --noexperimental_cc_shared_library \
            --noincompatible_remove_legacy_whole_archive \
            -c opt \
            --config=android_arm64 \
            @KleidiAI//:matmul
          # 查找库文件：优先 .a，其次 .so，最后 .lo
          MATMUL_LIB=$(find bazel-out/ -name "libmatmul.a" -path "*/arm64-v8a*" | head -1)
          if [ -z "$MATMUL_LIB" ]; then
            MATMUL_LIB=$(find bazel-out/ -name "libmatmul.so" -path "*/arm64-v8a*" | head -1)
          fi
          if [ -z "$MATMUL_LIB" ]; then
            MATMUL_LIB=$(find bazel-out/ -name "libmatmul.lo" -path "*/arm64-v8a*" | head -1)
          fi
          if [ -z "$MATMUL_LIB" ]; then
            echo "⚠️  Could not find libmatmul (a/lo/so), skipping symbol check"
          else
            echo "Checking symbols in $MATMUL_LIB"
            REQUIRED_SYMBOLS=(
              "kai_run_rhs_pack_nxk_qsi4cxps1s0_qsu4cxs1s0_neon"
              "kai_run_lhs_pack_f32p2vlx1_f32_sme"
              "kai_run_lhs_imatmul_pack_x32p2vlx1_x32p_sme"
              "kai_get_mr_matmul_clamp_f32_qai8dxp1vlx4_qsi8cxp4vlx4_1vlx4vl_sme2_mopa"
              "kai_run_matmul_clamp_f32_qai8dxp1vlx4_qsi8cxp4vlx4_1vlx4vl_sme2_mopa"
            )
            if [ "${MATMUL_LIB##*.}" = "so" ]; then
              NM_CMD="nm -D"
            else
              NM_CMD="nm"
            fi
            MISSING_SYMBOLS=()
            for symbol in "${REQUIRED_SYMBOLS[@]}"; do
              if ! $NM_CMD "$MATMUL_LIB" 2>/dev/null | grep -q "$symbol"; then
                MISSING_SYMBOLS+=("$symbol")
              fi
            done
            if [ ${#MISSING_SYMBOLS[@]} -ne 0 ]; then
              echo "❌ The following required symbols are missing from libmatmul:"
              printf '   %s\n' "${MISSING_SYMBOLS[@]}"
              echo "This usually means some source files were compiled but the function bodies"
              echo "are empty due to missing feature macros (e.g. __ARM_FEATURE_SME2)."
              exit 1
            fi
            echo "✅ All required symbols found in libmatmul"
          fi

          # 其余架构预热（关闭 cc_shared_library 以匹配）
          for arch in android_arm android_x86 android_x86_64; do
            echo "Building @XNNPACK//:XNNPACK for $arch (warmup only)"
            bazel build \
              --override_repository=XNNPACK=/tmp/xnnpack \
              --override_repository=KleidiAI=/tmp/kleidiai_repo \
              --noexperimental_cc_shared_library \
              --noincompatible_remove_legacy_whole_archive \
              -c opt \
              --cxxopt=--std=c++17 \
              --config=$arch \
              --fat_apk_cpu=x86,x86_64,arm64-v8a,armeabi-v7a \
              @XNNPACK//:XNNPACK \
              || echo "Prebuild for $arch completed with warnings (cache partial)"
          done
      # ========================================================================================

      # ✅ 在这里插入 hwloc 校验步骤
      - name: Pre-build hwloc for all Android architectures (compile check)
        run: |
          for arch in android_arm64 android_arm android_x86 android_x86_64; do
            echo "=== Building @hwloc//:hwloc for $arch ==="
            bazel build \
              --override_repository=XNNPACK=/tmp/xnnpack \
              --override_repository=KleidiAI=/tmp/kleidiai_repo \
              --noexperimental_cc_shared_library \
              --noincompatible_remove_legacy_whole_archive \
              -c opt \
              --cxxopt=--std=c++17 \
              --config=$arch \
              --fat_apk_cpu=x86,x86_64,arm64-v8a,armeabi-v7a \
              @hwloc//:hwloc \
              || { echo "❌ hwloc build failed for $arch"; exit 1; }
          done
          echo "✅ hwloc compiled successfully for all Android architectures"

      - name: Run build_android_package.sh
        run: |
          cd "$GITHUB_WORKSPACE"
          # 不再需要修补，直接运行
          ./ci/build_android_package.sh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          # 不传递 BAZEL_CONFIG_FLAGS

      - name: List generated files
        run: find ./ci/gen -type f

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litert-android-aars
          path: ci/gen/
          if-no-files-found: error
