name: Build and Upload Android AAR Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: "Build AARs with Bazel"
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "0.0.0-nightly-SNAPSHOT"
      BAZEL_CONFIG_FLAGS: "--incompatible_enable_android_toolchain_resolution=false"
      # BUILD_LITERT_KOTLIN_API: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazel-version: 7.0.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25
          local-cache: true

      - name: Export Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Verify Android paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la $ANDROID_HOME/platforms || true
          ls -la $ANDROID_NDK_HOME || true

      - name: Configure TensorFlow for Android
        run: |
          export TF_NEED_ANDROID=1
          export TF_SET_ANDROID_WORKSPACE=1
          if [ -f ./configure.py ]; then
            yes "" | python3 ./configure.py
          else
            echo "No configure.py found; assuming WORKSPACE is already configured."
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          TF_NEED_ANDROID: 1
          TF_SET_ANDROID_WORKSPACE: 1

      # Fix the api_level in WORKSPACE: change from float (e.g., 36.1) to integer (36)
      - name: Fix WORKSPACE api_level
        run: |
          # Backup WORKSPACE
          cp WORKSPACE WORKSPACE.bak
          # Replace api_level = 36.1 with api_level = 36 (assume .1 is a typo)
          sed -i 's/api_level = [0-9]\+\.[0-9]\+/api_level = 36/g' WORKSPACE
          # Also ensure any other floating point numbers are converted (e.g., 30.0 -> 30)
          sed -i 's/\(api_level = \)[0-9]\+\.0/\136/g' WORKSPACE
          echo "WORKSPACE after fix:"
          grep -n "api_level" WORKSPACE || true

      - name: Run build_android_package.sh
        run: |
          chmod +x ./ci/build_android_package.sh
          echo "BAZEL_CONFIG_FLAGS = $BAZEL_CONFIG_FLAGS"
          ./ci/build_android_package.sh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          BAZEL_CONFIG_FLAGS: ${{ env.BAZEL_CONFIG_FLAGS }}
          # BUILD_LITERT_KOTLIN_API: ${{ env.BUILD_LITERT_KOTLIN_API }}

      - name: List generated files
        run: find ./ci/gen -type f

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litert-android-aars
          path: ci/gen/
          if-no-files-found: error
