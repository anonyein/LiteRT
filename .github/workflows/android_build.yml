name: Build and Upload Android AAR Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: "Build AARs with Bazel"
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: "0.0.0-nightly-SNAPSHOT"
      # 保持原有的编译选项，不在这里添加 override_repository
      BAZEL_CONFIG_FLAGS: "--incompatible_enable_android_toolchain_resolution=false --linkopt=-Wl,--undefined-version --linkopt=-Wl,--allow-multiple-definition --copt=-D__ANDROID__ --copt=-UINTEL_MKL"
      ANDROID_API_LEVEL: "36"
      NDK_VERSION: "r27"
      KLEIDIAI_COMMIT: "51f7190558e51b7415d9ba24994fb477d7371446"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ---------- 克隆 XNNPACK ----------
      - name: Clone latest XNNPACK
        run: |
          git clone --depth 1 https://github.com/google/XNNPACK.git /tmp/xnnpack
          if grep -rq "xnn_define_static_constant_pad_v2" /tmp/xnnpack/include; then
            echo "✅ xnn_define_static_constant_pad_v2 found"
          else
            echo "❌ Required function not found"
            exit 1
          fi
          echo "XNNPACK cloned to /tmp/xnnpack"

      # ---------- 从 DownloadKleidiAI.cmake 获取 KleidiAI commit ----------
      - name: Extract KleidiAI commit from XNNPACK
        id: kleidiai_commit
        run: |
          CMAKE_FILE="/tmp/xnnpack/cmake/DownloadKleidiAI.cmake"
          if [ -f "$CMAKE_FILE" ]; then
            COMMIT=$(grep -oP 'archive/\K[a-f0-9]+' "$CMAKE_FILE" | head -1)
            if [ -z "$COMMIT" ]; then
              echo "⚠️ Could not parse commit, using fallback"
              COMMIT="$KLEIDIAI_COMMIT"
            fi
          else
            echo "⚠️ DownloadKleidiAI.cmake not found, using fallback"
            COMMIT="$KLEIDIAI_COMMIT"
          fi
          echo "KLEIDIAI_COMMIT=$COMMIT" >> $GITHUB_ENV
          echo "✅ Using KleidiAI commit: $COMMIT"

      # ---------- 克隆 KleidiAI ----------
      - name: Clone KleidiAI
        run: |
          git clone https://github.com/ARM-software/kleidiai.git /tmp/kleidiai
          cd /tmp/kleidiai
          git checkout $KLEIDIAI_COMMIT
          echo "KleidiAI ready at $(git rev-parse HEAD)"

      # ---------- 修复 KleidiAI 目录结构 ----------
      - name: Fix KleidiAI directory layout
        run: |
          cd /tmp/kleidiai
          if [ -d src/kai ]; then
            echo "✅ Already have src/kai"
          elif [ -d kai ]; then
            echo "Found kai at root, moving into src/kai..."
            mkdir -p src
            mv kai src/
          else
            echo "❌ Neither src/kai nor kai found"
            find . -maxdepth 2 -type d
            exit 1
          fi

      # ---------- 准备 @KleidiAI 仓库 ----------
      - name: Prepare @KleidiAI repository
        run: |
          rm -rf /tmp/kleidiai_repo
          cp -r /tmp/kleidiai /tmp/kleidiai_repo
          # 将源文件复制到 kai/ukernels/matmul 包内，使其能被 filegroup 匹配
          mkdir -p /tmp/kleidiai_repo/kai/ukernels/matmul
          cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/*.c /tmp/kleidiai_repo/kai/ukernels/matmul/ 2>/dev/null || true
          cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/*.S /tmp/kleidiai_repo/kai/ukernels/matmul/ 2>/dev/null || true
          cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/*.h /tmp/kleidiai_repo/kai/ukernels/matmul/ 2>/dev/null || true

          # 同时复制 pack 子目录下的文件（如果需要）
          if [ -d /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack ]; then
            mkdir -p /tmp/kleidiai_repo/kai/ukernels/matmul/pack
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack/*.c /tmp/kleidiai_repo/kai/ukernels/matmul/pack/ 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack/*.S /tmp/kleidiai_repo/kai/ukernels/matmul/pack/ 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/pack/*.h /tmp/kleidiai_repo/kai/ukernels/matmul/pack/ 2>/dev/null || true
          fi
          # 子目录 imatmul_clamp_*, matmul_clamp_* 等（如果有多个子目录，也可类似处理，或统一用 glob）
          for subdir in $(find /tmp/kleidiai_repo/src/kai/ukernels/matmul -mindepth 1 -maxdepth 1 -type d); do
            subname=$(basename "$subdir")
            mkdir -p "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname"
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/$subname/*.c "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname/" 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/$subname/*.S "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname/" 2>/dev/null || true
            cp /tmp/kleidiai_repo/src/kai/ukernels/matmul/$subname/*.h "/tmp/kleidiai_repo/kai/ukernels/matmul/$subname/" 2>/dev/null || true
          done

          echo "=== KleidiAI repo tree after copy ==="
          find /tmp/kleidiai_repo -type f \( -name '*.h' -o -name '*.c' -o -name '*.S' -o -name 'BUILD*' \) | sort

      - name: Verify qsi4cxp sources exist
        run: |
          cd /tmp/kleidiai_repo/src/kai
          echo "=== Searching for qsi4cxp files ==="
          find . -type f \( -name '*qsi4cxp*.c' -o -name '*qsi4cxp*.S' \) | tee /tmp/qsi4cxp_files.txt
          if [ ! -s /tmp/qsi4cxp_files.txt ]; then
            echo "❌ FATAL: No qsi4cxp implementation files found!"
            echo "This KleidiAI commit does not contain qsi4cxp."
            echo "Please update KLEIDIAI_COMMIT to a version that includes it."
            exit 1
          else
            echo "✅ qsi4cxp files found:"
            cat /tmp/qsi4cxp_files.txt
          fi

      # ---------- 创建 BUILD 文件（includes 添加 "."） ----------
      - name: Create BUILD files for @KleidiAI
        run: |
          REPO=/tmp/kleidiai_repo
          cat > $REPO/BUILD.bazel << 'EOF'
          package(default_visibility = ["//visibility:public"])

          cc_library(
              name = "common",
              hdrs = glob(["src/kai/**/*.h", "kai/ukernels/**/*.h"]),
              srcs = select({
                  "@platforms//cpu:aarch64": [
                      "src/kai/kai_common_sme_asm.S",
                      "src/kai/kai_common_sve_asm.S",
                  ],
                  "//conditions:default": [],
              }),
              includes = ["src", "."],
              alwayslink = 1,
              copts = select({
                  "@platforms//cpu:aarch64": [
                      "-Xclang", "-target-feature", "-Xclang", "+fp16",
                      "-Xclang", "-target-feature", "-Xclang", "+dotprod",
                      "-Xclang", "-target-feature", "-Xclang", "+i8mm",
                      "-Xclang", "-target-feature", "-Xclang", "+sme2",
                      "-Xclang", "-target-feature", "-Xclang", "+sve2",
                      "-Xclang", "-target-feature", "-Xclang", "+sme",
                      "-Xclang", "-target-feature", "-Xclang", "+bf16",
                      "-Wa,-march=armv8-a+sme2+fp16+dotprod",
                  ],
                  "//conditions:default": [],
              }),
          )

          cc_library(
              name = "matmul",
              srcs = select({
                  "@platforms//cpu:aarch64": ["@KleidiAI//kai/ukernels/matmul:matmul_srcs"],
                  "//conditions:default": [],
              }),
              hdrs = select({
                  "@platforms//cpu:aarch64": ["@KleidiAI//kai/ukernels/matmul:matmul_hdrs"],
                  "//conditions:default": [],
              }),
              includes = ["src"],
              alwayslink = 1,
              copts = select({
                  "@platforms//cpu:aarch64": [
                      "-Xclang", "-target-feature", "-Xclang", "+fp16",
                      "-Xclang", "-target-feature", "-Xclang", "+dotprod",
                      "-Xclang", "-target-feature", "-Xclang", "+i8mm",
                      "-Xclang", "-target-feature", "-Xclang", "+sme2",
                      "-Xclang", "-target-feature", "-Xclang", "+sve2",
                      "-Xclang", "-target-feature", "-Xclang", "+sme",
                      "-Xclang", "-target-feature", "-Xclang", "+bf16",
                      "-fno-tree-vectorize",
                      "-Wa,-march=armv8-a+sme2+fp16+dotprod",
                  ],
                  "//conditions:default": [],
              }),
              deps = [":common"],
          )
          EOF

          cat > $REPO/kai/ukernels/matmul/BUILD.bazel << 'EOF'
          package(default_visibility = ["//visibility:public"])
          filegroup(name = "matmul_srcs", srcs = glob(["**/*.c", "**/*.S"], exclude = ["BUILD.bazel"]))
          filegroup(name = "matmul_hdrs", srcs = glob(["**/*.h"]))
          alias(name = "matmul", actual = "//:matmul")
          EOF

          echo "=== @KleidiAI root BUILD ==="
          cat $REPO/BUILD.bazel
          echo "=== @KleidiAI matmul BUILD ==="
          cat $REPO/kai/ukernels/matmul/BUILD.bazel
          
      # ---------- 修补 XNNPACK BUILD（给 packing/pack_lh 加 common 依赖） ----------
      - name: Patch XNNPACK BUILD – add KleidiAI deps to MICROKERNEL_DEPS and packing targets
        run: |
          cd /tmp/xnnpack
          python3 << 'PYEOF'
          import re

          with open("BUILD.bazel", "r") as f:
              content = f.read()

          # 1. 更新 MICROKERNEL_DEPS
          deps_pattern = r'(MICROKERNEL_DEPS\s*=\s*\[)(.*?)(\])'
          m = re.search(deps_pattern, content, flags=re.DOTALL)
          if m:
              inner = m.group(2).rstrip()
              if not inner.endswith(','):
                  inner += ','
              if '"@KleidiAI//:common"' not in inner:
                  inner += '\n    "@KleidiAI//:common",\n    "@KleidiAI//:matmul",'
              content = content[:m.start(2)] + inner + content[m.end(2):]
              print("✅ Updated MICROKERNEL_DEPS")

          # 2. 在 packing 和 pack_lh 的 xnnpack_if_kleidiai_enabled 块中添加 @KleidiAI//:common
          targets = ["packing", "pack_lh"]
          for t in targets:
              # 找到 xnnpack_if_kleidiai_enabled 调用的括号列表，并插入新依赖
              # 匹配模式：xnnpack_if_kleidiai_enabled([ ... ])
              pattern = r'(xnnpack_if_kleidiai_enabled\s*\(\s*\[)([^]]*?)(\])'
              def add_common(m):
                  inner_list = m.group(2)
                  if '"@KleidiAI//:common"' in inner_list:
                      return m.group(0)  # 已存在
                  # 确保逗号
                  if inner_list.strip() and not inner_list.rstrip().endswith(','):
                      inner_list = inner_list.rstrip() + ',\n        '
                  elif not inner_list.strip():
                      inner_list = inner_list
                  inner_list += '"@KleidiAI//:common"'
                  return m.group(1) + inner_list + m.group(3)
              # 只替换在 packing 或 pack_lh 定义附近的那个块（简单起见替换所有匹配，但依赖名唯一，不会误伤）
              # 更精确：先找到目标定义的区域，但全局替换也足够安全
              content = re.sub(pattern, add_common, content, flags=re.DOTALL)

          with open("BUILD.bazel", "w") as f:
              f.write(content)
          print("✅ Injected @KleidiAI//:common into packing and pack_lh deps")
          PYEOF

          echo "=== Verify packing deps ==="
          grep -A 30 'name = "packing"' BUILD.bazel | head -35
          echo "=== Verify pack_lh deps ==="
          grep -A 30 'name = "pack_lh"' BUILD.bazel | head -35
          echo "=== MICROKERNEL_DEPS ==="
          grep -A 20 'MICROKERNEL_DEPS' BUILD.bazel | head -25

      # ---------- Inject overrides into build script ----------
      - name: Inject overrides into build script
        run: |
          sed -i 's/bazel build/bazel build --override_repository=XNNPACK=\/tmp\/xnnpack --override_repository=KleidiAI=\/tmp\/kleidiai_repo /g' ci/build_android_package.sh
          echo "✅ Injected XNNPACK and KleidiAI overrides"
          grep -n 'bazel build' ci/build_android_package.sh | head -5

      # ---------- 环境配置与构建 ----------
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazel-version: 7.0.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r27
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip -d /tmp
          NDK_PATH=/tmp/android-ndk-${NDK_VERSION}
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          ls -la $NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang* || exit 1
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}

      - name: Export Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Configure .bazelrc for NDK and overrides   # <-- 修改：在此统一配置 NDK 和仓库覆盖
        run: |
          echo "build --repo_env=ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> .bazelrc
          echo "build --action_env=ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> .bazelrc
          # 将覆盖仓库写入 .bazelrc，确保所有构建自动应用
          echo "build --override_repository=XNNPACK=/tmp/xnnpack" >> .bazelrc
          echo "build --override_repository=KleidiAI=/tmp/kleidiai_repo" >> .bazelrc

      - name: Disable layering_check globally and for monolithic config
        run: |
          echo "build --features=-layering_check" >> .bazelrc
          echo "build:monolithic --features=-layering_check" >> .bazelrc

      # ======================= XNNPACK 专用配置 ======================= #
      # 仍写入 .bazelrc，但也存入环境变量以备后用
      - name: Enable KleidiAI for arm64 (and disable for x86)
        run: |
          echo "build:android_arm64 --define=xnn_enable_kleidiai=true"   >> .bazelrc
          echo "build:android_arm   --define=xnn_enable_kleidiai=false"  >> .bazelrc
          echo "build:android_x86   --define=xnn_enable_kleidiai=false"  >> .bazelrc
          echo "build:android_x86_64 --define=xnn_enable_kleidiai=false" >> .bazelrc
          echo "build:kleidiai_query --define=xnn_enable_kleidiai=true"  >> .bazelrc
          echo "✅ KleidiAI: arm64=true, x86/x86_64=false"

      # 修复：解决静态库链接顺序导致的 undefined symbol 问题
      - name: Add linker group flags for symbol resolution
        run: |
          echo "build:android_arm64 --linkopt=-Wl,--start-group" >> .bazelrc
          echo "build:android_arm64 --linkopt=-Wl,--end-group"    >> .bazelrc
          echo "✅ Added --start-group/--end-group for android_arm64"
      # =============================================================== #

      - name: Verify Android paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la $ANDROID_HOME/platforms || true
          ls -la $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang* || true

      - name: Configure TensorFlow for Android
        run: |
          export TF_NEED_ANDROID=1
          export TF_SET_ANDROID_WORKSPACE=1
          if [ -f ./configure.py ]; then
            yes "" | python3 ./configure.py
          else
            echo "No configure.py found; assuming WORKSPACE is already configured."
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_HOME: ${{ env.ANDROID_SDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_API_LEVEL: ${{ env.ANDROID_API_LEVEL }}
          TF_NEED_ANDROID: 1
          TF_SET_ANDROID_WORKSPACE: 1

      # 打印当前的 .bazelrc 以便调试
      - name: Dump .bazelrc after configure
        run: |
          echo "=== Current .bazelrc ==="
          cat .bazelrc

      - name: Show api_level before fix
        run: |
          echo "=== Before fix ==="
          grep -n "api_level" WORKSPACE || echo "No api_level found"

      - name: Fix WORKSPACE api_level (float to int)
        run: |
          cp WORKSPACE WORKSPACE.bak
          sed -i 's/\(api_level\s*=\s*\)[0-9]\+\.[0-9]\+/\136/g' WORKSPACE
          echo "=== After fix ==="
          grep -n "api_level" WORKSPACE || echo "No api_level found"
          if grep -q "api_level.*\.[0-9]" WORKSPACE; then
            echo "Warning: Floating api_level still present, applying additional fix"
            sed -i 's/\(api_level\s*=\s*\)[0-9]*\.[0-9]*/\136/g' WORKSPACE
            grep -n "api_level" WORKSPACE
          fi

      # 移除脚本中可能导致问题的 SSE 标志（它们是 x86 专用的禁用标志）
      - name: Remove unsupported SSE flags from build script
        run: |
          cp ci/build_android_package.sh ci/build_android_package.sh.bak
          sed -i '/--copt=-mno-sse4/d' ci/build_android_package.sh
          echo "Patched script after removing SSE flags:"
          grep -n -- '--copt' ci/build_android_package.sh || echo "No --copt flags left"

      # 修复 libwebp：删除其 BUILD 文件中的 -msse4.1 选项
      - name: Fetch libwebp and remove -msse4.1 flag from its BUILD
        run: |
          bazel fetch @libwebp//...
          OUTPUT_BASE=$(bazel info output_base)
          WEBP_PATH="${OUTPUT_BASE}/external/libwebp"
          if [ -d "$WEBP_PATH" ]; then
            echo "Found libwebp at $WEBP_PATH"
            cp "$WEBP_PATH/BUILD.bazel" "$WEBP_PATH/BUILD.bazel.bak"
            sed -i '/"-msse4\.1"/d' "$WEBP_PATH/BUILD.bazel"
            echo "Patched libwebp BUILD: removed -msse4.1"
            if grep -q -- '-msse4' "$WEBP_PATH/BUILD.bazel"; then
              echo "ERROR: SSE flags still present!"
              grep -n -- '-msse4' "$WEBP_PATH/BUILD.bazel"
              exit 1
            else
              echo "SSE flags successfully removed."
            fi
          else
            echo "Error: libwebp not found at $WEBP_PATH"
            exit 1
          fi

      # 修复 xla 中的 tsl.bzl：删除 if_linux_x86_64(["-msse3"]) 行
      - name: Fetch xla and remove -msse3 flag from tsl.bzl
        run: |
          bazel fetch @xla//... || true
          OUTPUT_BASE=$(bazel info output_base)
          TSL_BZL_PATH="${OUTPUT_BASE}/external/xla/xla/tsl/tsl.bzl"
          if [ -f "$TSL_BZL_PATH" ]; then
            echo "Found tsl.bzl at $TSL_BZL_PATH"
            cp "$TSL_BZL_PATH" "$TSL_BZL_PATH.bak"
            sed -i '/if_linux_x86_64.*-msse3/d' "$TSL_BZL_PATH"
            echo "Patched tsl.bzl: removed -msse3 flag"
            if grep -q -- '-msse3' "$TSL_BZL_PATH"; then
              echo "ERROR: -msse3 flag still present in tsl.bzl!"
              grep -n -- '-msse3' "$TSL_BZL_PATH"
              exit 1
            else
              echo "-msse3 flag successfully removed from tsl.bzl."
            fi
          else
            echo "Warning: tsl.bzl not found at $TSL_BZL_PATH, xla may not be fully fetched."
          fi

      # 彻底删除 org_tensorflow 中所有文件里的 -msse3 标志，并打印被删除的行
      - name: Remove all -msse3 flags from TensorFlow source tree
        run: |
          OUTPUT_BASE=$(bazel info output_base)
          TF_DIR="${OUTPUT_BASE}/external/org_tensorflow"
          if [ -d "$TF_DIR" ]; then
            echo "Scanning $TF_DIR for files containing -msse3..."
            # 先列出所有包含 -msse3 的行
            find "$TF_DIR" -type f ! -name "*.o" ! -name "*.a" ! -name "*.so" ! -name "*.pyc" -exec grep -Hn -- '-msse3' {} \; | while IFS=: read file line_num line_content; do
              echo "Found in $file:$line_num: $line_content"
            done
            # 然后执行删除操作
            find "$TF_DIR" -type f ! -name "*.o" ! -name "*.a" ! -name "*.so" ! -name "*.pyc" -exec grep -l -- '-msse3' {} \; | while read file; do
              echo "Patching $file"
              cp "$file" "$file.bak"
              sed -i '/-msse3/d' "$file"
            done
            echo "Patching completed."
          else
            echo "TensorFlow directory not found, skipping"
          fi

      # 处理 ZenDNN 和 MKL 相关文件：删除有问题的源文件，并替换 mkl_util.h 为空文件
      - name: Handle MKL and ZenDNN files
        run: |
          OUTPUT_BASE=$(bazel info output_base)
          TF_DIR="${OUTPUT_BASE}/external/org_tensorflow"
          # 删除 ZenDNN 相关文件
          rm -vf "$TF_DIR/tensorflow/core/common_runtime/eager/zen_eager_op_rewrite.cc"
          rm -vf "$TF_DIR/tensorflow/core/graph/zen_graph_util.h"
          # 删除 MKL 源文件
          rm -vf "$TF_DIR/tensorflow/core/common_runtime/eager/mkl_eager_op_rewrite.cc"
          # 删除原 mkl_util.h 并创建空文件（使用 printf 避免 EOF 缩进问题）
          MKL_UTIL_H="$TF_DIR/tensorflow/core/util/mkl_util.h"
          rm -vf "$MKL_UTIL_H"
          mkdir -p "$(dirname "$MKL_UTIL_H")"
          printf '%s\n' "#ifndef TENSORFLOW_CORE_UTIL_MKL_UTIL_H_" \
                       "#define TENSORFLOW_CORE_UTIL_MKL_UTIL_H_" \
                       "// Empty file for Android build to satisfy dependencies." \
                       "#endif" > "$MKL_UTIL_H"
          echo "Created empty $MKL_UTIL_H"

      # 修复 hwloc
      - name: Fetch hwloc and apply fixes
        run: |
          bazel fetch @hwloc//... || true
          OUTPUT_BASE=$(bazel info output_base)
          HWLOC_DIR="${OUTPUT_BASE}/external/hwloc"
          if [ -d "$HWLOC_DIR" ]; then
            echo "Found hwloc at $HWLOC_DIR"
            BUILD_FILE="$HWLOC_DIR/BUILD.bazel"
            if [ -f "$BUILD_FILE" ]; then
              cp "$BUILD_FILE" "$BUILD_FILE.bak"
              echo "Before patching BUILD file (x86 sources):"
              grep -E 'topology-x86.*\.c' "$BUILD_FILE" || echo "  No x86 source found"
              # 删除包含 topology-x86.c 和 topology-x86_64.c 的行
              grep -v 'topology-x86.*\.c' "$BUILD_FILE" > "$BUILD_FILE.tmp"
              mv "$BUILD_FILE.tmp" "$BUILD_FILE"
              # 清理可能遗留的逗号
              sed -i 's/,\s*,/,/g; s/\[\s*,/[/g; s/,\s*\]/]/g; s/\[\s*\]/[]/g' "$BUILD_FILE"
              echo "After patching BUILD file:"
              grep -E 'topology-x86.*\.c' "$BUILD_FILE" || echo "  Success: no x86 source remaining"
            else
              echo "BUILD.bazel not found, skipping"
            fi

            # 修改 topology-linux.c 强制禁用 pthread affinity 函数
            LINUX_SRC="$HWLOC_DIR/hwloc/topology-linux.c"
            if [ -f "$LINUX_SRC" ]; then
              cp "$LINUX_SRC" "$LINUX_SRC.bak"
              echo "Patching $LINUX_SRC to disable pthread affinity..."
              sed -i '/#include "private\/autogen\/config.h"/a #undef HAVE_DECL_PTHREAD_SETAFFINITY_NP\n#define HAVE_DECL_PTHREAD_SETAFFINITY_NP 0\n#undef HAVE_DECL_PTHREAD_GETAFFINITY_NP\n#define HAVE_DECL_PTHREAD_GETAFFINITY_NP 0' "$LINUX_SRC"
              echo "Patched topology-linux.c"
            else
              echo "topology-linux.c not found, skipping"
            fi
          else
            echo "hwloc directory not found, skipping"
          fi

      # select-tf-ops 禁用 layering_check
      - name: Force disable layering_check for select-tf-ops build
        run: |
          sed -i '/\/\/tflite\/java:tensorflow-lite-select-tf-ops/ s/$/ --features=-layering_check/' ci/build_android_package.sh
          echo "✅ Appended --features=-layering_check to select-tf-ops build line"

      # ======================= 强制启用 XLA 支持 =======================
      - name: Enable XLA support for Android
        run: |
          echo "=== Enabling XLA for Android builds ==="
          sed -i 's/--define=with_xla_support=false/--define=with_xla_support=true/' .bazelrc
          echo "=== Modified .bazelrc (android config line) ==="
          grep -n 'with_xla_support' .bazelrc || echo "No with_xla_support lines found"
      # ================================================================

      # ======================= 预热 XNNPACK（完全匹配最终打包参数） =======================
      - name: Pre-build XNNPACK for arm64 (compile check)
        run: |
          echo "=== Warming XNNPACK with same config as final package ==="
          # 使用与最终打包完全一致的编译模式、架构参数
          bazel build \
            --override_repository=XNNPACK=/tmp/xnnpack \
            --override_repository=KleidiAI=/tmp/kleidiai_repo \
            -c opt \
            --cxxopt=--std=c++17 \
            --config=android_arm64 \
            --fat_apk_cpu=x86,x86_64,arm64-v8a,armeabi-v7a \
            @XNNPACK//:XNNPACK \
            || { echo "❌ XNNPACK build failed"; exit 1; }
      
          echo "✅ XNNPACK (arm64) compiled successfully with KleidiAI enabled."
      
          # 其余架构预热同样使用相同模式
          for arch in android_arm android_x86 android_x86_64; do
            echo "Building @XNNPACK//:XNNPACK for $arch (warmup only)"
            bazel build \
              --override_repository=XNNPACK=/tmp/xnnpack \
              --override_repository=KleidiAI=/tmp/kleidiai_repo \
              -c opt \
              --cxxopt=--std=c++17 \
              --config=$arch \
              --fat_apk_cpu=x86,x86_64,arm64-v8a,armeabi-v7a \
              @XNNPACK//:XNNPACK \
              || echo "Prebuild for $arch completed with warnings (cache partial)"
          done
      # ========================================================================================

      - name: Add fixedpoint dep to existing deps list and print BUILD
        run: |
          OUTPUT_BASE=$(bazel info output_base)
          BUILD_FILE="${OUTPUT_BASE}/external/org_tensorflow/tensorflow/core/BUILD"
          cp "$BUILD_FILE" "$BUILD_FILE.bak"

          export BUILD_FILE
          python3 << 'PYEOF'
          import os, re

          build_file = os.environ['BUILD_FILE']
          with open(build_file, 'r') as f:
              content = f.read()

          # 在 portable_tensorflow_lib_lite 规则的 deps = [ 之后立即插入依赖项
          pattern = r'(name\s*=\s*"portable_tensorflow_lib_lite".*?deps\s*=\s*\[)'
          replacement = r'\1\n        "@xla//xla/tsl/framework/fixedpoint",'
          new_content, count = re.subn(pattern, replacement, content, flags=re.DOTALL)

          if count == 0:
              raise Exception("Could not find deps list for portable_tensorflow_lib_lite")

          with open(build_file, 'w') as f:
              f.write(new_content)
          print("✅ Added fixedpoint dep to existing deps")
          PYEOF

          echo "=== Full patched BUILD file ==="
          cat "$BUILD_FILE"

          echo "=== Verification ==="
          # 检查规则范围内只出现一次 deps 定义
          RULE_BLOCK=$(grep -A 40 'name = "portable_tensorflow_lib_lite"' "$BUILD_FILE")
          DEPS_COUNT=$(echo "$RULE_BLOCK" | grep -c '^\s*deps\s*=' || true)
          if [ "$DEPS_COUNT" -ne 1 ]; then
            echo "❌ Found $DEPS_COUNT deps definitions (expected 1)"
            exit 1
          fi

          if echo "$RULE_BLOCK" | grep -q 'fixedpoint'; then
            echo "✅ Dependency inserted and verified"
          else
            echo "❌ fixedpoint not found in rule"
            exit 1
          fi
          
      - name: Run build_android_package.sh
        run: |
          # 进入 Bazel 实际使用的 XNNPACK 源目录（/tmp/xnnpack）
          cd /tmp/xnnpack

          # 1. 确保 MICROKERNEL_DEPS 已包含 KleidiAI 依赖（幂等修补）
          python3 << 'PYEOF'
          import re
          with open("BUILD.bazel", "r") as f:
              content = f.read()

          # 更新 MICROKERNEL_DEPS
          deps_pattern = r'(MICROKERNEL_DEPS\s*=\s*\[)(.*?)(\])'
          m = re.search(deps_pattern, content, flags=re.DOTALL)
          if m:
              inner = m.group(2).rstrip()
              if not inner.endswith(','):
                  inner += ','
              for dep in ['"@KleidiAI//:common"', '"@KleidiAI//:matmul"']:
                  if dep not in inner:
                      inner += f'\n    {dep},'
              content = content[:m.start(2)] + inner + content[m.end(2):]

          # 2. 给所有 _prod_microkernels 目标显式添加 common 和 matmul 依赖
          def inject_deps(match):
              rule = match.group(0)
              needed = ['"@KleidiAI//:common"', '"@KleidiAI//:matmul"']
              if all(d in rule for d in needed):
                  return rule
              deps_match = re.search(r'(deps\s*=\s*\[)(.*?)(\])', rule, flags=re.DOTALL)
              if deps_match:
                  inner = deps_match.group(2).rstrip()
                  if inner and not inner.endswith(','):
                      inner += ','
                  for d in needed:
                      if d not in inner:
                          inner += f'\n        {d},'
                  rule = rule[:deps_match.start(2)] + inner + rule[deps_match.end(2):]
              else:
                  # 目标没有 deps，新增一个
                  deps_str = '\n    deps = [' + ', '.join(needed) + '],'
                  rule = rule.rstrip().rstrip(')') + deps_str + '\n)'
              return rule

          pattern = r'(cc_library\s*\(.*?name\s*=\s*"[^"]*_prod_microkernels".*?\)\n\})'
          content = re.sub(pattern, inject_deps, content, flags=re.DOTALL)

          # 3. 修补 packing 和 pack_lh 的 xnnpack_if_kleidiai_enabled 列表
          def add_matmul(m):
              inner = m.group(2)
              needed = ['"@KleidiAI//:common"', '"@KleidiAI//:matmul"']
              for d in needed:
                  if d not in inner:
                      if inner.rstrip() and not inner.rstrip().endswith(','):
                          inner = inner.rstrip() + ','
                      inner += d
              return m.group(1) + inner + m.group(3)

          pattern2 = r'(xnnpack_if_kleidiai_enabled\s*\(\s*\[)([^\]]*?)(\])'
          content = re.sub(pattern2, add_matmul, content, flags=re.DOTALL)

          with open("BUILD.bazel", "w") as f:
              f.write(content)
          print("✅ Injected common/matmul into all relevant targets")
          PYEOF

          # 4. 验证关键修改是否生效
          if grep -q '@KleidiAI//:matmul' BUILD.bazel; then
            echo "✅ matmul dependency present in BUILD.bazel"
          else
            echo "❌ FAILED to inject matmul dependency"
            exit 1
          fi

          # 5. 回到工作目录并执行打包（此时 /tmp/xnnpack/BUILD.bazel 已正确修改）
          cd "$GITHUB_WORKSPACE"
          chmod +x ./ci/build_android_package.sh
          echo "=== Final build commands (first 5) ==="
          grep -n 'bazel build' ci/build_android_package.sh | head -5
          echo "BAZEL_CONFIG_FLAGS = $BAZEL_CONFIG_FLAGS"
          ./ci/build_android_package.sh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          BAZEL_CONFIG_FLAGS: ${{ env.BAZEL_CONFIG_FLAGS }}

      - name: List generated files
        run: find ./ci/gen -type f

      - name: Upload AAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: litert-android-aars
          path: ci/gen/
          if-no-files-found: error
